# Production stack for freeride. Run from this directory:
#   docker compose --env-file /data/projects/mieru/mieru.env up -d --build
# Traefik (Dokploy) routes $APP_DOMAIN to the app through the labels below.
name: mieru

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=512M
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: mieru
      MYSQL_USER: mieru
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    volumes:
      - db-data:/var/lib/mysql
    networks: [internal]
    mem_limit: 1g
    healthcheck:
      test:
        ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mieru-app:latest
    restart: unless-stopped
    # Runs as the host user that owns the storage directory, so no root chown is needed.
    user: '${HOST_UID:?}:${HOST_GID:?}'
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ORIGIN: https://${APP_DOMAIN:?}
      DATABASE_URL: mysql://mieru:${MYSQL_PASSWORD}@db:3306/mieru
      TRUST_PROXY: ${TRUST_PROXY:-2}
      BACKUP_DIR: /var/lib/mieru/backups
      LOG_LEVEL: info
      JWT_SECRET: ${JWT_SECRET:?}
      LINK_TOKEN_KEY: ${LINK_TOKEN_KEY:?}
      TICKET_SECRET: ${TICKET_SECRET:?}
      VIEW_SALT_SECRET: ${VIEW_SALT_SECRET:?}
    volumes:
      - ${STORAGE_PATH:?}:/var/lib/mieru/storage
      - ${BACKUP_PATH:?}/db:/var/lib/mieru/backups:ro
    networks: [internal, dokploy-network]
    mem_limit: 2g
    cpus: 4
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dokploy-network
      traefik.http.routers.mieru.rule: Host(`${APP_DOMAIN:?}`)
      traefik.http.routers.mieru.entrypoints: web
      traefik.http.services.mieru.loadbalancer.server.port: '3000'

  backup:
    image: mysql:8.4
    restart: unless-stopped
    user: '${HOST_UID:?}:${HOST_GID:?}'
    entrypoint: ['bash', '/backup.sh']
    environment:
      MYSQL_HOST: db
      MYSQL_USER: mieru
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_DATABASE: mieru
      TZ: Asia/Seoul
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${STORAGE_PATH:?}:/storage:ro
      - ${BACKUP_PATH:?}:/backups
    networks: [internal]
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy

networks:
  internal: {}
  dokploy-network:
    external: true

volumes:
  db-data: {}
